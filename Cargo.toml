[package]
name = "bevy_ios_alerts"
version = "0.8.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["extrawurst <mail@rusticorn.com>"]
documentation = "https://docs.rs/bevy_ios_alerts"
repository = "https://github.com/rustunit/bevy_ios_alerts"
keywords = ["bevy", "gamedev", "mobile", "ios", "objc2"]
description = "Bevy plugin to request ios native UIAlert popups"

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"

[dependencies]
bevy_ecs = { version = "0.18", default-features = false }
bevy_app = { version = "0.18", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
bevy_channel_message = "0.2"
bevy_log = { version = "0.18", default-features = false }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSObject",
    "NSSet",
    "NSString",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UIAlertController",
    "UIApplication",
    "UIControl",
    "UIResponder",
    "UIScene",
    "UISceneDefinitions",
    "UITextField",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
